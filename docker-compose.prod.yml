services:
  app:
    build: .
    container_name: siopa-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - siopa_data:/app/data
      - siopa_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    container_name: siopa-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  siopa_data:
  siopa_logs:
  caddy_data:
  caddy_config:
