plugins { id 'com.android.application' }
android {
    namespace 'br.com.siopa.offline'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'br.com.siopa.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '3.0.0-offline'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/siopaAssets')] } }
}
def staticRoot = file('../../../app/static')
def coreFiles = ['index.html','app.js','app.css','offline-store.js','analysis-engine.js','analysis-worker.js','crops.json','manifest.webmanifest','icon.svg','service-worker.js']
tasks.register('syncWebAssets', Sync) {
    doFirst { coreFiles.each { name -> if (!new File(staticRoot, name).isFile()) throw new GradleException("Asset obrigatório ausente: ${name}") } }
    into layout.buildDirectory.dir('generated/siopaAssets')
    from(staticRoot) { include 'index.html', 'manifest.webmanifest', 'icon.svg', 'service-worker.js'; into 'siopa' }
    from(staticRoot) { include 'app.js','app.css','offline-store.js','analysis-engine.js','analysis-worker.js','crops.json'; into 'siopa/static' }
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
