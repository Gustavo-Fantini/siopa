name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node for cross-runtime image checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall main.py app tests

      - name: Check bundled browser scripts
        run: |
          node --check app/static/analysis-engine.js
          node --check app/static/analysis-worker.js
          node --check app/static/offline-store.js
          node --check app/static/app.js

      - name: Run isolated test suite and cross-runtime parity
        run: python -m pytest -q
